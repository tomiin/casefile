services:
  db:
    image: mariadb:11
    container_name: casefile-test-db
    environment:
      MARIADB_ROOT_PASSWORD: casefiletest
      MARIADB_DATABASE: casefile
    ports:
      - "3307:3306"          # host 3307 -> container 3306 (avoids clashing with any local MySQL)
    volumes:
      - ./sql:/docker-entrypoint-initdb.d:ro   # auto-loads Casefile's schema on first start
